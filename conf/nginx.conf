# armada_av owns this whole domain (CORD-07's PUBLIC_ORIGIN must be a bare
# origin - no path), so there is no sub-path templating here, only two
# proxied routes plus a catch-all.

# CORD-07 §2's two broker endpoints.
location ^~ /.well-known/concord/av {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# LiveKit's signaling websocket. The client SDK appends /rtc itself, so
# clients are handed the bare origin and never dial this path directly.
# LiveKit's /twirp server API is deliberately NOT routed here: nothing
# public needs it, the broker probes it over loopback, and exposing it would
# only offer the API credentials up for guessing.
location ^~ /rtc {
    proxy_pass http://127.0.0.1:__PORT_LIVEKIT_SIGNAL__;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location / {
    default_type text/plain;
    return 200 "armada-av\n";
}
